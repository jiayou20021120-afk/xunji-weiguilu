/* ===================== 文物图鉴 ===================== */
const CX = { cat:'全部', pick:0 };
function cxList(){
  return (typeof RELICS === 'undefined' ? [] : RELICS)
    .filter(r => CX.cat === '全部' || r.cat === CX.cat);
}
function buildCodex(){
  $('#cxSub').textContent = (typeof GAME !== 'undefined' && GAME.title) ? GAME.title : '';
  const ORDER = ['青铜器', '石刻', '建筑构件', '古籍文献'];   // 新稿的页签顺序
  const have = [...new Set((typeof RELICS==='undefined'?[]:RELICS).map(r => r.cat))];
  const cats = ['全部',
    ...ORDER.filter(c => have.includes(c)),
    ...have.filter(c => !ORDER.includes(c))];
  const tabs = $('#cxTabs');
  tabs.innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.classList.toggle('on', c === CX.cat);
    b.onclick = () => { CX.cat = c; CX.pick = 0; CX.page = 0; buildCodex(); SFX.click(); };
    tabs.appendChild(b);
  });

  const list = cxList();
  const PER = 8;                                   // 一页八格，跟新稿的四列两行对齐
  const pages = Math.max(1, Math.ceil(list.length / PER));
  if(CX.page == null) CX.page = 0;
  CX.page = Math.min(Math.max(0, CX.page), pages - 1);
  if(CX.pick < CX.page * PER || CX.pick >= (CX.page + 1) * PER) CX.page = Math.floor(CX.pick / PER);

  const grid = $('#cxGrid');
  grid.innerHTML = '';
  list.slice(CX.page * PER, CX.page * PER + PER).forEach((r, k) => {
    const i = CX.page * PER + k;
    const d = document.createElement('div');
    d.className = 'cxCard' + (i === CX.pick ? ' on' : '');
    /* 编号不再自己画，缩略图上本来就印着一个，画两遍会重影 */
    d.innerHTML = `<div class="th">${r.img ? `<img src="${r.img}" alt="">` : '<div class="ph">待补图</div>'}</div>
      <div class="nm">${r.name}</div>`;
    d.onclick = () => { CX.pick = i; buildCodex(); SFX.click(); };
    grid.appendChild(d);
  });
  $('#cxPage').textContent = (CX.page + 1) + ' / ' + pages;
  $('#cxPrev').disabled = CX.page === 0;
  $('#cxNext').disabled = CX.page >= pages - 1;
  $('#cxPrev').onclick = () => { if(CX.page > 0){ CX.page--; buildCodex(); SFX.click(); } };
  $('#cxNext').onclick = () => { if(CX.page < pages - 1){ CX.page++; buildCodex(); SFX.click(); } };

  const r = list[CX.pick];
  if(!r){ $('#cxName').textContent = ''; return; }
  const big = r.hero || r.img;   // 有大图就用大图，没有就退回缩略图
  $('#cxHero').innerHTML = big ? `<img src="${big}" alt="">` : '<div class="ph">待补图</div>';
  $('#cxName').textContent = r.name;
  const eraTodo = r.era.startsWith('?');   // 待核的字段标红，提醒别当成品发出去
  $('#cxMeta').innerHTML =
    `<span${eraTodo ? ' class="todo"' : ''}>时代：${r.era.replace(/^\?/, '')}</span>` +
    `<span>类别：${r.cat}</span>`;
  if(r.desc){ $('#cxDesc').textContent = r.desc; $('#cxDesc').classList.remove('todo'); }
  else { $('#cxDesc').textContent = '文物描述待补'; $('#cxDesc').classList.add('todo'); }
  $('#cxSteps').innerHTML = (r.flow || []).map(s =>
      `<span class="${s.startsWith('?') ? 'todo' : ''}">${s.replace(/^\?/, '')}</span>`)
    .join('<span class="arw">→</span>');
}
function openCodex(){ buildCodex(); $('#codex').classList.add('on'); SFX.click(); }
function closeCodex(){ $('#codex').classList.remove('on'); }

/* ===================== 地图选章 ===================== */
function clearedChapters(){
  const s = readSave();
  return (s && Array.isArray(s.cleared)) ? s.cleared : [];
}
/* 通关过就一直是已结案，哪怕现在正在重打第一章 */
function caseFinished(){
  const s = readSave();
  return !!(s && (s.finished || (Array.isArray(s.cleared) && s.cleared.includes(6))));
}
/* 一桩案子打到第几章了 */
function caseProgress(id){
  if(id !== 'boshu') return 0;
  return clearedChapters().length;
}
function buildMap(){
  const canvas = $('#mapCanvas');
  $('#mapHead h2').textContent = CASES.title;
  $('#mapHead .sub').textContent = CASES.hint;
  canvas.querySelectorAll('.mapNode').forEach(n => n.remove());
  $('#mapSvg').innerHTML = '';

  CASES.items.forEach(c => {
    const prog = caseProgress(c.id);
    const allDone = (c.id === 'boshu' && caseFinished())
                 || (c.chapters > 0 && prog >= c.chapters);
    const el = document.createElement('div');
    el.className = 'mapNode' + (c.playable ? ' open' : '') + (allDone ? ' done' : '');
    /* 新版底图给了宽高，就按矩形铺；老数据只有中心点，退回原来的定位方式 */
    el.style.cssText = (c.w && c.h)
      ? `left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%`
      : `left:${c.x}%;top:${c.y}%`;
    const state = !c.playable ? '未开放'
                : allDone     ? '已结案'
                : prog > 0    ? `${prog}/${c.chapters} 章`
                              : '待追索';
    const meta = c.playable
      ? `${c.route}<br>${c.span}　共 ${c.chapters} 章`
      : '案卷尚未整理';
    el.innerHTML =
      `<div class="cState">${state}</div>` +
      `<div class="cName">${c.name}</div>` +
      `<div class="cSub">${c.sub}</div>` +
      `<div class="cMeta">${meta}</div>`;
    if(c.playable) el.onclick = () => enterCase(c.id);
    canvas.appendChild(el);
  });
}
function openMap(){
  buildMap();
  $('#map').classList.add('on');
  $('#menu').classList.add('off');
  SFX.click();
}
function closeMap(){ $('#map').classList.remove('on'); }

/* 每章挑一张能代表它的场景图当封面 */
const CH_COVER = ['assets/scene_study_lit.jpg', 'assets/scene_office_front.jpg',
                  'assets/pv1.jpg', 'assets/vault_1946.jpg',
                  'assets/news_wide.jpg', 'assets/hall_ch6.jpg'];

function openChapterSelect(){
  const grid = $('#chGrid');
  grid.innerHTML = '';
  CHAPTERS.forEach((ch, i) => {
    const d = document.createElement('div');
    d.className = 'chCard';
    const nm = ch.name.replace(/^第.章\s*·\s*/, '');
    d.innerHTML = `<img src="${CH_COVER[i]}" alt="">` +
      `<span class="no">${String(i + 1).padStart(2, '0')}</span>` +
      `<div class="body"><div class="nm">${nm}</div><div class="yr">${ch.year}</div></div>`;
    d.onclick = () => pickChapter(i);
    grid.appendChild(d);
  });
  $('#chsel').classList.add('on');
  SFX.click();
}
function closeChapterSelect(){ $('#chsel').classList.remove('on'); }

/* 直接跳进第 n 章（0 起）。前面几章的物证按已收算，证据板才不会是空的 */
async function pickChapter(n){
  closeChapterSelect();
  state.collected = EVIDENCE.filter(e => e.ch <= n).map(e => e.id);
  state.cleared   = [];
  for(let k = 1; k <= n; k++) state.cleared.push(k);
  state.finished  = true;         // 通关记录留着，回地图还是「已结案」
  saveGame(true);
  await runChapter(n, false);
}

async function enterCase(id){
  if(id !== 'boshu'){ toast('这桩案子还没开放'); return; }
  closeMap();
  const s = readSave();
  if(!(s && s.started)){                       // 头一回打
    state.collected = []; state.cleared = [];
    await runChapter(0, true);
    return;
  }
  state.collected = s.collected || [];
  state.cleared   = Array.isArray(s.cleared) ? s.cleared : [];
  state.finished  = !!s.finished || state.cleared.includes(6);
  if(state.cleared.includes(6)){               // 上一轮打完了，这次让他自己挑章
    openChapterSelect();
    return;
  }
  const n  = Math.min(s.chapter || 0, CHAPTERS.length - 1);
  const ch = CHAPTERS[n];
  if(s.step >= ch.steps.length){                // 上次正好把那一章打完，接着开下一章
    await runChapter(Math.min(n + 1, CHAPTERS.length - 1), false);
    return;
  }
  await resumeGame(true);                       // 打到一半，回到停下的地方
}

/* ===================== 流程 ===================== */
async function playLines(scrId, boxId, lines, hold = 1600){
  const scr = $('#' + scrId), box = $('#' + boxId);
  box.innerHTML = '';
  scr.classList.toggle('para', lines.length > 1);   // 一行是题记，多行是场景交代
  scr.classList.add('on');
  for(const line of lines){
    const p = document.createElement('p');
    p.textContent = line;
    box.appendChild(p);
    await sleep(100);
    p.classList.add('on');
    await sleep(hold);
  }
  await waitClick(scr);
  SFX.click();
  scr.classList.remove('on');
}

/* 开场：世界观引入。每屏逐行浮现，点击进下一屏，可整段跳过。 */
async function playWorld(){
  const w = $('#world'), box = $('#worldBox'), trace = $('#worldTrace');
  box.innerHTML = '';
  trace.style.width = '0';
  w.classList.add('on');
  let skipped = false;
  const skip = e => { e.stopPropagation(); skipped = true; };
  $('#worldSkip').onclick = skip;

  for(let i = 0; i < WORLD.length && !skipped; i++){
    box.innerHTML = '';
    const ps = WORLD[i].map(t => {
      const p = document.createElement('p');
      p.textContent = t; box.appendChild(p); return p;
    });
    for(const p of ps){
      if(skipped) break;
      await sleep(90); p.classList.add('on');
      await sleep(1150);
    }
    if(skipped) break;
    trace.style.width = Math.round((i + 1) / WORLD.length * 46) + 'vw';
    // 停一拍，其间点画面可以直接进下一屏
    await Promise.race([sleep(1700), waitClick(w)]);
    if(skipped) break;
    ps.forEach(p => { p.classList.remove('on'); p.classList.add('out'); });
    await sleep(600);
  }
  w.classList.remove('on');
  await sleep(400);
}


/* 这一章用哪种转场，在 CH1.transition 里写 */
async function doTransition(){
  const t = CH1.transition || 'flash';
  B.classList.add('tr-' + t);
  const f = $('#flash');
  if(t === 'shutter'){            // 快门：亮一下，暗一下，再亮
    f.classList.add('on');  await sleep(120);
    f.classList.remove('on'); await sleep(90);
    f.classList.add('on');  await sleep(160);
    SFX.flash ? SFX.flash() : SFX.glow();
  }else if(t === 'fog'){          // 雾：慢慢涨上来
    f.classList.add('on'); await sleep(1700);
  }else if(t === 'sepia'){        // 旧照片：先褪色再压过去
    $('#bg').style.filter = $('#bg2').style.filter = 'saturate(.2) contrast(1.1)';
    await sleep(900);
    f.classList.add('on'); await sleep(1200);
    $('#bg').style.filter = $('#bg2').style.filter = '';
  }else if(t === 'dim'){          // 暗转：灯一盏盏灭
    f.classList.add('on'); await sleep(1600);
  }else if(t === 'glass'){        // 玻璃：一道反光扫过去
    f.classList.add('on'); await sleep(1100);
  }else{
    f.classList.add('on'); await sleep(500);
  }
  return async () => {            // 收场
    f.classList.remove('on');
    await sleep(t === 'fog' ? 1600 : t === 'dim' ? 1400 : 700);
    B.classList.remove('tr-' + t);
  };
}

/* 2026 库房 → 亲手触碰那卷仿制帛书 → 穿越 */
async function playCrossing(){
  const cross = $('#cross'), box = $('#crossLines'), hot = $('#relicHot');
  box.innerHTML = '';
  $('#crossBg').src = CH1.storage;
  $('#relicA').src = CH1.relic.dim;
  $('#relicB').src = CH1.relic.lit;
  const h = CH1.relicHot;
  hot.style.cssText = `left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%`;
  hot.classList.remove('on');
  $('#relicTip').classList.remove('on');
  $('#relicShot').classList.remove('on','two');
  cross.classList.remove('zoom');
  cross.classList.add('on');
  await sleep(60);
  cross.classList.add('lit');                   // 库房淡入
  await sleep(1600);

  for(const line of CH1.prologue){
    const p = document.createElement('p');
    p.textContent = line;
    box.appendChild(p);
    await sleep(100); p.classList.add('on');
    await sleep(1500);
  }
  await sleep(500);
  hot.classList.add('on');                      // 那卷帛书亮起呼吸光
  await sleep(900);
  $('#relicTip').textContent = CH1.touchPrompt;
  $('#relicTip').classList.add('on');

  await waitClick(hot);                         // 必须玩家亲手去碰
  SFX.click();
  $('#relicTip').classList.remove('on');
  hot.classList.remove('on');
  cross.classList.add('zoom');                  // 镜头向它推近

  $('#relicShot').classList.add('on');          // 切近看它亮起来
  await sleep(800);
  $('#relicShot').classList.add('two');
  SFX.warp();
  await sleep(1500);

  $('#burst').classList.add('on');              // 光从中心炸开
  await sleep(1200);
  const closeTr = await doTransition();          // 这一章自己的转场
  cross.classList.remove('on','lit','zoom');
  $('#relicShot').classList.remove('on','two');
  $('#burst').classList.remove('on');
  await sleep(300);
  await closeTr();
  await sleep(400);
}

async function enterScene(announce){
  $('#hudCh').textContent = CH1.name + ' · ' + CH1.year;
  $('#hudNum').textContent = state.collected.length;
  const curtained = !B.classList.contains('inscene');
  await setBg(sceneBg(), curtained ? 0 : 1200);
  if(state.lit) B.classList.add('lit');
  if(curtained){ B.classList.add('inscene'); await sleep(1100); }
  await sleep(300);
  if(announce) await os(CH1.introTip || '一盏油灯。屋子里只有它还亮着。', 2400);
  const cur = CH1.steps[state.step];
  if(cur) tip(cur.hotspot === 'lamp' ? '太暗了。先把灯挑亮。' : '继续找线索');
  refreshTargets();
}

/* 主视觉上的开始追索。第一次进先看世界观，之后直接进地图。 */
async function startGame(){
  const seen = readSave();
  if(seen && !confirm('重新开始会清掉当前进度，确定吗？')) return;
  if(seen){ clearSave(); state.cleared = []; state.collected = []; state.step = 0; }
  SFX.click();
  $('#menu').classList.add('off');
  await playWorld();  // 第一次开局先把「循迹者是什么」讲清楚
  openMap();
}

/* 开始某一章。first 为真时才走穿越那段，后面的章直接接上 */
async function runChapter(n, first){
  finishing = false;
  stopWatch();
  BGM.stop(700); AMB.stop(700); BG2.stop(700);
  // 上一章可能留着结束屏、特写、信纸这些浮层，开新章前一律收掉
  ['#end','#epi','#cross','#world','#dlg','#cu','#lt','#unf','#pv','#fin','#board','#doc']
    .forEach(sel => { const el = $(sel); if(el) el.classList.remove('on','two','open','done','show','lit','zoom'); });
  $('#burst').classList.remove('on');
  $('#flash').classList.remove('on');
  // 开场这一段场景热区必须是死的，否则玩家能在穿越和章引之间把第一步先点掉，
  // 等到 playIntro 演完才放开
  state.busy = true; B.classList.add('busy');
  useChapter(n);
  $('#hudCh').textContent = CH1.name + ' · ' + CH1.year;   // 跳章时别还挂着上一章的名字
  state.started = true;
  state.step = 0;
  B.classList.remove('inscene', 'lit');
  $('#hudNum').textContent = state.collected.length;
  if(CH1.amb) AMB.play(CH1.amb.src, { vol: CH1.amb.vol == null ? 1 : CH1.amb.vol,
                                      loopFrom: CH1.amb.loopFrom, fade: 2200 });
  if(CH1.bgm) BGM.play(CH1.bgm.src, { from: CH1.bgm.from || 0, vol: CH1.bgm.vol,
                                      loopFrom: CH1.bgm.loopFrom, once: CH1.bgm.once, fade: 2600 });
  stopLyrics();
  if(CH1.lyrics) startLyrics(CH1.lyrics);   // 歌词整章跟着曲子走
  if(first) await playCrossing();
  else      await playChapterCard();
  await playLines('epi', 'epiBox', [CH1.epigraph], 2100);
  buildHotspots();
  if(CH1.isPV){                     // 这一章是过场，没有可点的东西
    await playIntro();
    await playPV();
    if(CH1.reveals && CH1.reveals.waybill) await revealLetter('waybill');
    state.busy = false; B.classList.remove('busy');
    await finishChapter();
    return;
  }
  await playIntro();
  state.busy = false; B.classList.remove('busy');
  await enterScene(true);
}
/* 续档进来时，把这一章此刻本该响着的东西补上。
   已经走过的步骤里若换过曲子，接最后那一首，不从章头的底噪重来。 */
function armChapterAudio(){
  let spec = null;
  for(let i = 0; i < state.step && i < CH1.steps.length; i++){
    const st = CH1.steps[i];
    if(st.bgm || st.bgmOnDialogue) spec = st.bgm || st.bgmOnDialogue;
    if(st.bgmStop || (st.after && st.after.bgmStop)) spec = null;   // 这一步已经把曲子收了，别再放回来
  }
  if(CH1.amb && !(spec && !spec.keepAmb))
    AMB.play(CH1.amb.src, { vol: CH1.amb.vol == null ? 1 : CH1.amb.vol,
                            loopFrom: CH1.amb.loopFrom, fade: 2200 });
  const bgm = spec || CH1.bgm;
  if(bgm)
    BGM.play(bgm.src, { from: bgm.from || 0, vol: bgm.vol,
                        loopFrom: bgm.loopFrom, fade: 2600 });
}

/* 第二章往后不再重放穿越，用一张黑场字卡交代时间地点 */
async function playChapterCard(){
  B.classList.remove('inscene');
  if(CH1.enterSfx && SFX[CH1.enterSfx]) SFX[CH1.enterSfx]();
  if(CH1.enterSnd) oneShot(CH1.enterSnd.src, CH1.enterSnd.vol);
  await sleep(500);
  await playLines('epi', 'epiBox', CH1.prologue, 1700);
}

/* 落地 1943：他抬起头，像看见了你 */
async function playIntro(){
  $('#hudCh').textContent = CH1.name + ' · ' + CH1.year;
  B.classList.add('busy');
  await setBg(CH1.cutin, 0);        // 幕后摆好镜头
  await sleep(120);
  B.classList.add('inscene');       // 拉幕：从黑场淡入蔡季襄
  await sleep(1200);
  await dialogue(CH1.intro);
  await setBg(CH1.bgDim, 1100);
  B.classList.remove('busy');
}

function showMenu(){
  $('#mResume').classList.toggle('hide', !readSave());
  $('#mResume').textContent = '重 新 开 始';
  $('#menu').classList.remove('off');
  SFX.click();
}

async function resumeGame(fromMap){
  // 菜单只是叠在当前这一局上面，点继续就退回去接着玩
  if(state.started && !fromMap){
    $('#menu').classList.add('off');
    SFX.click();
    return;
  }
  const s = readSave();
  if(!s) return startGame();
  finishing = false;
  state.started = true;
  useChapter(Math.min(s.chapter || 0, CHAPTERS.length - 1));
  state.step = s.step; state.collected = s.collected || [];
  state.lit = !!s.lit; state.cleared = s.cleared || [];
  state.era = s.era ?? state.era;
  state.facingBack = !!s.facingBack;
  if(state.era === 'boxes') CH1.boxesBg = 'assets/threeboxes.jpg';
  SFX.click();
  $('#menu').classList.add('off');
  buildHotspots();
  await enterScene(false);
  toast('回到上次的地方');
  armChapterAudio();
  const cur = CH1.steps[state.step];
  if(cur && cur.auto) runStep(cur);
  else if(!cur) finishChapter();
}

/* ---------- 初始化 ---------- */
function init(){
  // 不预先给底层挂图：世界观、库房、章引这些过场之间只会露出黑幕
  $('#hudCh').textContent = CH1.name + ' · ' + CH1.year;
  buildHotspots();

  state.cleared = clearedChapters();
  state.finished = caseFinished();
  if(readSave()){
    $('#mResume').classList.remove('hide');
    $('#mResume').textContent = '重 新 开 始';
  }else{
    $('#mResume').textContent = '重 新 开 始';
  }

  /* 画面上那行“点击进入游戏”是主按钮：有存档直接续，没有就从头开 */
  $('#mStart').onclick = () => {
    if(readSave()){ $('#menu').classList.add('off'); openMap(); }
    else startGame();
  };
  $('#mResume').onclick = () => startGame();
  $('#mapBoard').onclick = openBoard;
  $('#mapCodex').onclick = openCodex;
  $('#mapSet').onclick   = () => { $('#btnSound').click(); };
  $('#rotate').onclick   = e => { e.stopPropagation(); $('#rotate').classList.add('gone'); };
  $('#mapHome').onclick  = () => { closeMap(); $('#menu').classList.remove('off'); SFX.click(); };
  $('#chBack').onclick   = () => { closeChapterSelect(); openMap(); };
  $('#chAll').onclick    = () => pickChapter(0);
  $('#mResume').classList.toggle('hide', !readSave());
  $('#mTitle').textContent = GAME.title;
  $('#mChap').textContent  = GAME.chip || '第一案 · 帛书';
  $('#mSub').textContent   = GAME.sub;
  document.title = GAME.title + ' · ' + CH1.name.replace(/^第.章 · /, '');
  $('#mArchive').onclick = () => openDoc('idea');    // 创意说明
  $('#mAbout').onclick   = () => openDoc('howto');   // 玩法说明
  $('#mSetting').onclick = () => { $('#btnSound').click(); };
  $('#cxBack').onclick   = closeCodex;
  $('#btnBoard').onclick = openBoard;
  $('#btnSave').onclick  = () => saveGame(false);
  $('#boardFic').onclick   = () => openDoc('fiction');
  $('#boardClose').onclick = closeBoard;
  $('#btnMenu').onclick = () => { saveGame(true); backToMap(); };
  $('#btnSound').onclick = () => {
    const on = SFX.toggle();
    $('#btnSound').textContent = '音效 ' + (on ? '开' : '关');
  };

  $('#hot').addEventListener('click', async () => {
    if(state.busy || !state.started) return;
    state.busy = true; B.classList.add('busy');
    SFX.click();
    await os(CH1.idle[Math.floor(Math.random() * CH1.idle.length)], 1800);
    state.busy = false; B.classList.remove('busy');
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'd' || e.key === 'D') B.classList.toggle('debug');
    if(e.key === 'Escape'){ closeBoard(); $('#doc').classList.remove('on'); }
  });

  const pre = [CH1.bgDim, CH1.bgLit, CH1.cutin, CH1.avatar, CH1.storage, CH1.relic.dim, CH1.relic.lit,
    ...Object.values(CH1.unfurls || {}).map(u => u.img),
    (CH1.ending && CH1.ending.lastShot && CH1.ending.lastShot.img),
    ...CH1.steps.flatMap(st => st.closeup ? st.closeup.imgs : []),
    ...Object.values(CH1.reveals).map(r => r.img),
    ...EVIDENCE.filter(e => e.img).map(e => e.img)];
  pre.forEach(u => { const i = new Image(); i.src = u; });
}
init();
</script>
